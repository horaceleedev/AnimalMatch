<text x="20" y="552" class="t">A deployment is one camera at one location for a period of time. Co-located cameras are separate deployments sharing locationID/locationName.</text>
<text x="20" y="572" class="t">Camtrap DP only allows WGS84 lat/long: UTM is kept as entered and converted when needed (map now, export later).</text>
<text x="20" y="592" class="t">individuals.videos and crops.source_video still point at videos (unchanged).</text>
